<style>
/* Layout: หัวหน้า + แถบสรุปติดบน (ชิปทุกไอเทม) + หมวดใหญ่ -> ส่วนย่อยต่อไอเทม กริดการ์ด 20 ใบ (เลือกได้ 1 ต่อไอเทม) */
:root {
  --bg: #eef2ec; --panel: #ffffff; --ink: #1d2a22; --muted: #5d6b62; --line: #d5ded6;
  --pic: #2a2e36; --pic-ink: #aab3bd; --gold: #c9871a; --gold-soft: #f6e3bf; --accent: #2f6b4f;
  --display: "Kanit", "Sarabun", system-ui, sans-serif; --body: "Sarabun", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a17; --panel: #1b2622; --ink: #eaf1ec; --muted: #9aaca2; --line: #2c3a34;
  --gold: #f0b54a; --gold-soft: #3a2f1a; --accent: #7fc4a0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121a17; --panel: #1b2622; --ink: #eaf1ec; --muted: #9aaca2; --line: #2c3a34;
  --gold: #f0b54a; --gold-soft: #3a2f1a; --accent: #7fc4a0; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 120px; }
header h1 { font: 700 clamp(26px, 4vw, 38px)/1.15 var(--display); margin: 0 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 62ch; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  margin-top: 18px; padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1 1 520px; min-width: 0; max-height: 26vh; overflow-y: auto; }
.chip { font: 600 12px/1 var(--body); padding: 5px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); text-decoration: none; }
.chip.done { border-color: var(--gold); color: var(--ink); background: var(--gold-soft); }
.count { font: 600 13px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.copy { font: 700 15px/1 var(--display); border: 0; border-radius: 10px; padding: 11px 16px; background: var(--accent); color: var(--bg); cursor: pointer; }
.copy:focus-visible, .card:focus-visible, .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.out { width: 100%; font: 13px/1.4 ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
.group { margin: 44px 0 0; font: 700 30px/1.15 var(--display); border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
section { margin-top: 26px; scroll-margin-top: 160px; }
section h2 { font: 700 21px/1.2 var(--display); margin: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
section h2 small { font: 500 13px/1 var(--body); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }
.pic { aspect-ratio: 1; max-width: 100%; border-radius: 8px; background: var(--pic); color: var(--pic-ink); display: grid; place-items: center; overflow: hidden; font-size: 12px; }
.pic img { width: 100%; height: 100%; object-fit: contain; }
.num { position: absolute; top: 12px; left: 12px; font: 700 15px/1 var(--display); width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--line); }
.card[aria-pressed="true"] .num { background: var(--gold); border-color: var(--gold); color: var(--panel); }
.name { font-weight: 600; font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; }
.meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>เลือกหน้าตาไอเทม</h1>
    <p>รอบที่ 5: 15 ไอเทมที่ยังไม่มีโมเดล ไอเทมละ 20 แบบ ไม่ซ้ำกับทุกรอบก่อน รอบนี้ลองดึงทุกแบบเข้า Studio มาแล้ว ทุกอันในหน้านี้ดึงได้จริง ไม่มีชิ้นส่วนที่แปลงไม่ได้ และไม่ใช่แพ็กสัตว์ กดการ์ดเพื่อเลือก 1 แบบต่อไอเทม แล้วกดคัดลอกผลส่งกลับมาในแชต</p>
  </header>
  <div class="bar">
    <div class="chips" id="chips"></div>

    <button class="copy" id="copy" type="button">คัดลอกผลที่เลือก</button>
    <div class="out" id="out" hidden></div>
  </div>

</div>

let picks = {};
try { picks = JSON.parse(localStorage.getItem("itemPicks5") || "{}") || {}; } catch (e) { picks = {}; }
const save = () => { try { localStorage.setItem("itemPicks5", JSON.stringify(picks)); } catch (e) {} };
const list = document.getElementById("list"), chips = document.getElementById("chips");
const KEYS = GROUPS.flatMap(g => g[1]).filter(k => DATA[k]);
for (const [gname, allKeys] of GROUPS) {
  const keys = allKeys.filter(k => DATA[k]);
  if (!keys.length) continue;
  const h = document.createElement("h3"); h.className = "group"; h.textContent = gname; list.appendChild(h);
  for (const k of keys) {
    const items = DATA[k] || [];
    const sec = document.createElement("section");
    sec.id = k;
    sec.innerHTML = `<h2>${META[k]} <small>${k} · ${items.length} แบบ</small></h2><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    items.forEach((it, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "card"; b.id = `card-${k}-${i + 1}`;
      b.innerHTML = `<span class="num">${i + 1}</span><span class="pic">${it.img ? `<img loading="lazy" alt="" src="${it.img}">` : "ไม่มีรูป"}</span><span class="name"></span><span class="meta"></span>`;
      const img = b.querySelector("img");
      if (img) img.alt = it.name;
      b.querySelector(".name").textContent = it.name;
      b.querySelector(".meta").textContent = `id ${it.id}${it.creator ? " · " + it.creator : ""}`;
      b.addEventListener("click", () => { picks[k] = picks[k] === i + 1 ? undefined : i + 1; save(); render(); });
      grid.appendChild(b);
    });
    list.appendChild(sec);
  }
}
function summary() {
  return KEYS.map(k => picks[k] ? `${META[k]} ${picks[k]} (id ${DATA[k][picks[k] - 1].id})` : null).filter(Boolean).join(", ");
}
function render() {
  chips.innerHTML = "";
  let n = 0;
  for (const k of KEYS) {
    if (picks[k]) n++;
    const a = document.createElement("a");
    a.href = "#" + k; a.className = "chip" + (picks[k] ? " done" : "");
    a.textContent = `${META[k]}${picks[k] ? " · " + picks[k] : ""}`;
    chips.appendChild(a);
    DATA[k].forEach((_, i) => document.getElementById(`card-${k}-${i + 1}`).setAttribute("aria-pressed", String(picks[k] === i + 1)));
  }
  document.getElementById("count").textContent = `เลือกแล้ว ${n}/${KEYS.length}`;
}
document.getElementById("copy").addEventListener("click", async () => {
  const text = summary() || "ยังไม่ได้เลือก";
  const out = document.getElementById("out");
  out.textContent = text; out.hidden = false;
  const btn = document.getElementById("copy");
  try { await navigator.clipboard.writeText(text); btn.textContent = "คัดลอกแล้ว"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "เลือกข้อความด้านล่างแล้ว กด Ctrl+C"; }
  setTimeout(() => { btn.textContent = "คัดลอกผลที่เลือก"; }, 2500);
});
render();
